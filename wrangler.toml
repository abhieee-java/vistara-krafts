#:schema node_modules/wrangler/config-schema.json
name = "vistara-krafts"
compatibility_date = "2025-02-01"
pages_build_output_dir = "."

# ============================================================================
# VISTĀRA KRAFTS — CLOUDFLARE FULL-STACK CONFIGURATION (100% FREE TIER)
# ============================================================================
# Works on Cloudflare Free Plan ($0/month):
# - Cloudflare Pages & Functions (Frontend + /api/* Edge Routes)
# - Cloudflare D1 (Serverless SQLite Database for Users, Addresses & Orders)
# - Cloudflare KV (Edge Auth Sessions & Token Revocation)
# - Cloudflare R2 (Product & Bridal Varmala Photo Storage)
# - Cloudflare Turnstile (Bot-free Login & Checkout Verification)

[vars]
ENVIRONMENT = "development"
BRAND_NAME = "Vistāra Krafts"
# Official Cloudflare Turnstile test sitekey for development:
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
GOOGLE_CLIENT_ID = "DEV_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
APPLE_CLIENT_ID = "in.vistarakrafts.storefront.dev"

# Uncomment after running `npx wrangler d1 create vistara_krafts_db`:
# [[d1_databases]]
# binding = "VISTARA_DB"
# database_name = "vistara_krafts_db"
# database_id = "YOUR_DEV_D1_DATABASE_ID"

# Uncomment after running `npx wrangler kv namespace create VISTARA_SESSIONS`:
# [[kv_namespaces]]
# binding = "VISTARA_SESSIONS"
# id = "YOUR_DEV_KV_NAMESPACE_ID"

# Uncomment after running `npx wrangler r2 bucket create vistara-krafts-media`:
# [[r2_buckets]]
# binding = "VISTARA_MEDIA"
# bucket_name = "vistara-krafts-media"

# ============================================================================
# CLIENT PRODUCTION CREDENTIALS (USE WHEN SHIPPING LATER)
# ============================================================================
[env.production.vars]
ENVIRONMENT = "production"
BRAND_NAME = "Vistāra Krafts"
TURNSTILE_SITE_KEY = "REPLACE_WITH_CLIENT_TURNSTILE_SITE_KEY"
GOOGLE_CLIENT_ID = "REPLACE_WITH_CLIENT_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
APPLE_CLIENT_ID = "REPLACE_WITH_CLIENT_APPLE_SERVICES_ID"
# Secrets to set via CLI (`npx wrangler pages secret put <NAME>`):
# - JWT_SECRET
# - TURNSTILE_SECRET_KEY
# - RAZORPAY_KEY_SECRET
